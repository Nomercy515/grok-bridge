<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />
  <title>Grok Bridge</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="rail" id="sidebar" aria-label="Sessions">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="/logo-64.png" width="34" height="34" alt="" />
        </span>
        <div class="brand-copy">
          <div class="brand-title">Grok Bridge</div>
          <div class="brand-sub" id="modeBadge"></div>
        </div>
      </div>
      <button type="button" class="btn primary" id="btnNew">New session</button>
      <nav class="session-list" id="sessionList" aria-label="Session list"></nav>
      <div class="sidebar-foot">
        <button type="button" class="rail-cog" id="btnSettings" aria-label="Session options" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsModal">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M7.4 2.2h3.2l.35 1.55a5.2 5.2 0 0 1 1.15.48l1.45-.7 1.6 2.77-1.1 1.15c.1.38.16.77.16 1.18s-.06.8-.16 1.18l1.1 1.15-1.6 2.77-1.45-.7a5.2 5.2 0 0 1-1.15.48L10.6 15.8H7.4l-.35-1.55a5.2 5.2 0 0 1-1.15-.48l-1.45.7-1.6-2.77 1.1-1.15A5.1 5.1 0 0 1 3.8 9c0-.41.06-.8.16-1.18l-1.1-1.15 1.6-2.77 1.45.7a5.2 5.2 0 0 1 1.15-.48L7.4 2.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <circle cx="9" cy="9" r="2.1" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>
      </div>
      <div class="settings-modal" id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-card">
          <h2 class="settings-title" id="settingsTitle">Options</h2>
          <label class="opt-row" for="demoToggle">
            <span>Enable Demo mode</span>
            <span class="switch">
              <input type="checkbox" id="demoToggle" role="switch" />
              <span class="switch-ui" aria-hidden="true"></span>
            </span>
          </label>
          <label class="opt-row" for="grokOnlyToggle">
            <span>Include Grok Only subagent sessions</span>
            <input type="checkbox" id="grokOnlyToggle" />
          </label>
          <button type="button" class="btn restart-hub" id="btnRestart">Restart Bridge hub</button>
        </div>
      </div>
    </aside>

    <div class="backdrop" id="backdrop" hidden></div>

    <main class="stage">
      <header class="topbar">
        <button type="button" class="icon-btn" id="btnMenu" aria-label="Open sessions">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="topbar-brand" aria-hidden="true">
          <span class="wordmark">Grok</span>
        </div>
        <h1 class="chat-title" id="chatTitle">Select a session</h1>
        <div class="status-cluster" role="status" aria-live="polite">
          <div class="ctx-wrap">
            <span class="pill ctx-meter" id="ctxMeter" title="Session context">—</span>
            <span class="ctx-sub" id="ctxSub" hidden>via Grok Build</span>
          </div>
        </div>
      </header>

      <div class="feed" id="feed" role="log" aria-live="polite" aria-relevant="additions"></div>

      <button type="button" class="btn-jump-bottom" id="btnJumpBottom" hidden aria-label="Jump to latest" title="Jump to latest">
        <span class="btn-jump-icon" aria-hidden="true">↓</span>
        <span class="btn-jump-label">Latest</span>
      </button>

      <div class="composer-dock">
        <form class="composer" id="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Message Grok Bridge…"
            autocomplete="off"
            enterkeyhint="send"
            aria-label="Message Grok Bridge"
          ></textarea>
          <button type="submit" class="btn send" id="btnSend" disabled aria-label="Send message" title="Send">
            <span class="btn-label">Send</span>
            <svg class="icon-send" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 7h9M7 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="icon-stop" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" hidden>
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.2" fill="currentColor"/>
            </svg>
          </button>
        </form>
        <p class="composer-hint muted">Enter to send · Shift+Enter for newline · primary button becomes Stop mid-reply</p>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
